<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users Directory</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { padding: 0.4rem; width: 100%; max-width: 320px; box-sizing: border-box; }
    #status { min-height: 1.5rem; margin: 1rem 0; }
    #status.error { color: #b00020; }
    #users-list { list-style: none; padding: 0; }
    #users-list li { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; }
    #users-list h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
    #users-list p { margin: 0; }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <h1>Users</h1>
  <button id="load-users" type="button">Load users</button>
  <label for="filter-input">Filter by name</label>
  <input id="filter-input" type="text" placeholder="Type a name...">
  <p id="status" role="status" aria-live="polite"></p>
  <ul id="users-list"></ul>
</body>
</html>
