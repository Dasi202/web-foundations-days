<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 · Live note</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1> Quick note</h1>

    <label for="note-text" class="note-label">your note (max 200 chars)</label>
    <textarea id="note-text" rows="5" placeholder="Write something…" maxlength="220"></textarea>

    <!-- character & word counts -->
    <div class="counter-panel">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <!-- buttons -->
    <div class="actions">
      <button id="clear-btn" type="button">Clear</button>
      <button id="theme-toggle" type="button">Dark mode</button>
    </div>
  </main>
</body>
</html>
