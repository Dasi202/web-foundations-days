<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="/web-foundations-days/day2/styles.css" />
  </head>
  <body>
    <header>
        <nav>
            <ul>
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="/web-foundations-days/day1/about.html">About</a></li>
            </ul>
        </nav>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">New note</label>
                <input type="text" id="note-input" placeholder="Type a note..."><br></br>
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section>
            <h2>My Notes</h2>
            <ul class="features" id="notes-list">
                <li>Revise HTML forms</li>
                <li>Push my code to github</li>
                <li>Set-up Guide</li>
            </ul>
        </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes.Built during Web Foundations,</p>
    </footer>
  </body>
</html>
